{% extends "base.html" %}
{% block title %}Change Password – LibraryMS{% endblock %}
{% block content %}
<div class="lg-page-header">
    <div>
        <span class="lg-eyebrow">Security</span>
        <h1>Change Password</h1>
        <p>Update your account access credentials</p>
    </div>
</div>
<div class="row">
    <div class="col-md-6 col-lg-5">
        <div class="card glass">
            <div class="card-body p-4">
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label for="current_password" class="form-label">Current Password</label>
                        <input type="password" class="form-control" id="current_password" name="current_password" placeholder="••••••••" required>
                    </div>
                    <div class="mb-3">
                        <label for="new_password" class="form-label">New Password</label>
                        <input type="password" class="form-control" id="new_password" name="new_password" placeholder="••••••••" required minlength="6">
                    </div>
                    <div class="mb-4">
                        <label for="confirm_password" class="form-label">Confirm New Password</label>
                        <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                        Update Password
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
