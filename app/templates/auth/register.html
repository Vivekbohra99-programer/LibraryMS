{% extends "base.html" %}
{% block title %}Register – LibraryMS{% endblock %}
{% block public_content %}
<div class="lg-auth">
    <div class="card glass" style="max-width: 560px">
        <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
                <span class="lg-logo mx-auto mb-3" style="width:52px;height:52px;border-radius:18px" aria-hidden="true">
                    <svg style="width:28px;height:28px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/>
                    </svg>
                </span>
                <span class="lg-eyebrow d-block">Join the Stacks</span>
                <h2 class="fw-bold mt-1">Create Account</h2>
                <p class="text-muted small">Register as a library member to borrow books</p>
            </div>
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="name" class="form-label">Full Name</label>
                        <div class="input-group">
                            <span class="input-group-text" id="reg-name-addon">
                                <svg style="width:16px;height:16px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                            </span>
                            <input type="text" class="form-control" id="name" name="name" placeholder="John Doe" aria-label="Full name" aria-describedby="reg-name-addon" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label for="username" class="form-label">Username</label>
                        <div class="input-group">
                            <span class="input-group-text" id="reg-user-addon">
                                <svg style="width:16px;height:16px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-3.92 7.94"/></svg>
                            </span>
                            <input type="text" class="form-control" id="username" name="username" placeholder="johndoe" aria-label="Username" aria-describedby="reg-user-addon" required>
                        </div>
                    </div>
                    <div class="col-12">
                        <label for="email" class="form-label">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text" id="reg-email-addon">
                                <svg style="width:16px;height:16px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                            </span>
                            <input type="email" class="form-control" id="email" name="email" placeholder="john@example.com" aria-label="Email address" aria-describedby="reg-email-addon" required>
                        </div>
                    </div>
                    <div class="col-12">
                        <label for="phone" class="form-label">Phone (Optional)</label>
                        <div class="input-group">
                            <span class="input-group-text" id="reg-phone-addon">
                                <svg style="width:16px;height:16px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                            </span>
                            <input type="text" class="form-control" id="phone" name="phone" placeholder="+91 98765 43210" aria-label="Phone number" aria-describedby="reg-phone-addon">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label for="password" class="form-label">Password</label>
                        <div class="input-group">
                            <span class="input-group-text" id="reg-pass-addon">
                                <svg style="width:16px;height:16px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                            </span>
                            <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" aria-label="Password" aria-describedby="reg-pass-addon" required minlength="6">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label for="confirm_password" class="form-label">Confirm Password</label>
                        <div class="input-group">
                            <span class="input-group-text" id="reg-cpass-addon">
                                <svg style="width:16px;height:16px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                            </span>
                            <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="••••••••" aria-label="Confirm password" aria-describedby="reg-cpass-addon" required>
                        </div>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 mt-4 mb-3">
                    Create Member Account
                </button>
            </form>
            <div class="text-center pt-2">
                <span class="text-muted small">Already have an account?</span>
                <a href="{{ url_for('auth.login') }}" class="ms-1 small fw-semibold">Sign in here</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
