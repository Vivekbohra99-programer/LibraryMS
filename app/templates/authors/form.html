{% extends "base.html" %}
{% block title %}{{ action }} Author – LibraryMS{% endblock %}
{% block content %}
<div class="lg-page-header">
    <div>
        <span class="lg-eyebrow">Author Maintenance</span>
        <h1>{{ action }} Author</h1>
        <p>{{ 'Add a new author profile to the directory' if action == 'Add' else 'Edit author biographical details' }}</p>
    </div>
</div>

<div class="row">
    <div class="col-md-6 col-lg-5">
        <div class="card glass">
            <div class="card-body p-4">
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label" for="author-name">Name <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="author-name" name="name" value="{{ author.name if author else '' }}" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label" for="author-bio">Biography</label>
                        <textarea class="form-control" id="author-bio" name="bio" rows="4">{{ author.bio if author else '' }}</textarea>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            {{ action }} Author
                        </button>
                        <a href="{{ url_for('authors.index') }}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
